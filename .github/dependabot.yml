version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    versioning-strategy: increase
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      linting:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "jsdom"
          - "happy-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # @why 这些 workflow 已从仓库移除（main 仅存 ci.yml / link-check.yml），
      # 升级对应 action 无意义，且合并会把已删除的 workflow 文件重新引入。
      - dependency-name: "actions/labeler"
      - dependency-name: "actions/stale"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "amannn/action-semantic-pull-request"
      - dependency-name: "marocchino/sticky-pull-request-comment"
