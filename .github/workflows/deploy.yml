name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + TypeCheck + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: nextjs-${{ runner.os }}-

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build

# Cloudflare Pages 自动构建部署（build command 已配置 git submodule update + next build）
