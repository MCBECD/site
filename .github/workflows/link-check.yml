name: Link Checker

on:
  pull_request:
    paths:
      - "content/docs/**"
      - "**/*.md"
      - "**/*.mdx"
  push:
    branches: [main]
    paths:
      - "content/docs/**"
      - "**/*.md"
      - "**/*.mdx"
  workflow_dispatch:
  schedule:
    # 每周一 9:00 UTC+8 = 01:00 UTC 检查一次
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --exclude-localhost --exclude-loopback --exclude-private --max-concurrency 10 --timeout 10 "content/docs/**/*.md" "*.md" "CONTRIBUTING.md" "README.md"
          fail: true
          format: markdown
          jobSummary: true
