name: Render Animation

# 手动触发：Actions → Render Animation → Run workflow
# 产物：animation/out/mcbecd-animation.mp4
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chinese font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install deps
        working-directory: animation
        run: npm install --no-audit --no-fund

      - name: Render animation
        working-directory: animation
        run: npx remotion render DemoAnimation out/mcbecd-animation.mp4 --codec=h264

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: mcbecd-animation
          path: animation/out/mcbecd-animation.mp4
          retention-days: 30
